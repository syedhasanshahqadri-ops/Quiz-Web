<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Test Result</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="result-container">

        <div class="result-card">

            <div class="result-icon">
                🏆
            </div>

            <h1>Test Completed!</h1>

            <p class="result-message">
                Here is your final result.
            </p>


            <div class="student-result">

                <div>
                    <span>Name</span>
                    <strong id="resultName"></strong>
                </div>

                <div>
                    <span>Roll Number</span>
                    <strong id="resultRoll"></strong>
                </div>

            </div>


            <div class="score-circle">

                <div>
                    <span id="percentage">0%</span>
                    <small>Score</small>
                </div>

            </div>


            <div class="result-stats">

                <div class="stat">
                    <strong id="correctAnswers">0</strong>
                    <span>Correct</span>
                </div>

                <div class="stat">
                    <strong id="wrongAnswers">0</strong>
                    <span>Wrong</span>
                </div>

                <div class="stat">
                    <strong id="unanswered">0</strong>
                    <span>Unanswered</span>
                </div>

                <div class="stat">
                    <strong>20</strong>
                    <span>Total</span>
                </div>

            </div>


            <div class="final-score">

                <h2>
                    Score:
                    <span id="finalScore">0 / 20</span>
                </h2>

                <p>
                    Time Used:
                    <strong id="timeUsed">00:00</strong>
                </p>

            </div>


            <button
                class="start-btn"
                onclick="window.location.href='index.html'">

                Take Test Again

            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
